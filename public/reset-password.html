<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EcoMap – Yeni şifre</title>
<style>
  :root { --green:#059669; --text:#111827; --muted:#6b7280; --bg:#f9fafb; --danger:#b91c1c; --dangerBg:#fee2e2; --okBg:#d1fae5; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:420px; margin:0 auto; padding:32px 16px; }
  h1 { font-size:22px; margin:0 0 8px; }
  p { color:var(--muted); margin:0 0 20px; line-height:1.4; }
  label { display:block; font-size:14px; font-weight:600; margin:14px 0 6px; }
  input { width:100%; font-size:16px; padding:12px; border:1px solid #d1d5db; border-radius:10px; background:#fff; }
  button { width:100%; margin-top:20px; font-size:16px; font-weight:600; padding:14px; border:0; border-radius:10px; background:var(--green); color:#fff; }
  button:disabled { opacity:.6; }
  .msg { padding:12px; border-radius:10px; margin-bottom:16px; font-size:14px; }
  .err { background:var(--dangerBg); color:var(--danger); }
  .ok { background:var(--okBg); color:#065f46; }
  a { color:var(--green); font-weight:600; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>Yeni şifre belirle</h1>
  <p id="intro">E-postandaki bağlantıyla geldin. Yeni şifreni iki kez yaz.</p>
  <div id="msg" class="msg" hidden></div>
  <form id="form" hidden>
    <label for="p1">Yeni şifre</label>
    <input id="p1" type="password" autocomplete="new-password" minlength="6" required>
    <label for="p2">Yeni şifre (tekrar)</label>
    <input id="p2" type="password" autocomplete="new-password" minlength="6" required>
    <button id="btn" type="submit">Şifreyi kaydet</button>
  </form>
  <p id="done" hidden><a href="/auth/sign-in">Giriş sayfasına git</a></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
  // Public project address and publishable (anon) key — the same values already in the app bundle.
  var SUPABASE_URL = 'https://mfrefgdqcivrxugkwikg.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1mcmVmZ2RxY2l2cnh1Z2t3aWtnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQyMjMyODEsImV4cCI6MjEwOTc5OTI4MX0.REdkCngD4HXjH19shnTT0YUTWCa8kyL0e4PJCTNetVE';

  var msg = document.getElementById('msg');
  var form = document.getElementById('form');
  function show(text, ok) { msg.textContent = text; msg.className = 'msg ' + (ok ? 'ok' : 'err'); msg.hidden = false; }

  var client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: true, flowType: 'implicit' }
  });

  async function start() {
    var hash = new URLSearchParams(location.hash.slice(1));
    var query = new URLSearchParams(location.search);
    var err = hash.get('error_description') || query.get('error_description');
    if (err) { show('Bağlantı geçersiz ya da süresi dolmuş. Yeni bir sıfırlama e-postası iste. (' + err + ')'); return; }

    var tokenHash = query.get('token_hash');
    if (tokenHash) {
      var r = await client.auth.verifyOtp({ token_hash: tokenHash, type: 'recovery' });
      if (r.error) { show('Bağlantı doğrulanamadı: ' + r.error.message); return; }
    }

    // Give detectSessionInUrl a moment to read the tokens from the address.
    var session = null;
    for (var i = 0; i < 20 && !session; i++) {
      session = (await client.auth.getSession()).data.session;
      if (!session) await new Promise(function (res) { setTimeout(res, 150); });
    }
    if (!session) { show('Bu sayfa sadece şifre sıfırlama e-postasındaki bağlantıyla çalışır.'); return; }
    history.replaceState(null, '', location.pathname);
    form.hidden = false;
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    var p1 = document.getElementById('p1').value, p2 = document.getElementById('p2').value;
    if (p1 !== p2) { show('İki şifre aynı değil.'); return; }
    if (p1.length < 6) { show('Şifre en az 6 karakter olmalı.'); return; }
    var btn = document.getElementById('btn'); btn.disabled = true;
    var r = await client.auth.updateUser({ password: p1 });
    btn.disabled = false;
    if (r.error) { show('Şifre kaydedilemedi: ' + r.error.message); return; }
    form.hidden = true;
    document.getElementById('intro').hidden = true;
    show('Şifren değişti. Şimdi yeni şifrenle giriş yapabilirsin.', true);
    document.getElementById('done').hidden = false;
    await client.auth.signOut();
  });

  start();
</script>
</body>
</html>
